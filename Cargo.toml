[package]
name = "favico"
version = "0.1.12"
edition = "2024"
rust-version = "1.88.0"
description = "A command-line utility for creating favicons"
homepage = "https://sorairolake.github.io/favico/"
repository = "https://github.com/sorairolake/favico"
license = "GPL-3.0-or-later"
keywords = ["favicon", "icon"]
categories = ["command-line-utilities"]
include = ["/LICENSES", "/README.md", "/src"]

[dependencies]
anyhow = "1.0.102"
bat = { version = "0.26.1", default-features = false, features = ["regex-fancy"] }
clap = { version = "4.5.60", features = ["derive", "wrap_help"] }
clap_complete = "4.5.66"
clap_complete_nushell = "4.5.10"
csscolorparser = "0.8.2"
image = { version = "0.25.9", default-features = false, features = [
  "bmp",
  "ico",
  "png",
  "rayon",
] }
indicatif = "0.18.4"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sysexits = "0.12.0"
xbm = { version = "0.3.0", optional = true }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.25.0"

[features]
default = [
  "dds",
  "exr",
  "ff",
  "gif",
  "hdr",
  "jpeg",
  "pnm",
  "qoi",
  "tga",
  "tiff",
  "webp",
  "xbm",
]
dds = ["image/dds"]
exr = ["image/exr"]
ff = ["image/ff"]
gif = ["image/gif"]
hdr = ["image/hdr"]
jpeg = ["image/jpeg"]
pnm = ["image/pnm"]
qoi = ["image/qoi"]
tga = ["image/tga"]
tiff = ["image/tiff"]
webp = ["image/webp"]
xbm = ["dep:xbm"]

[lints.clippy]
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
